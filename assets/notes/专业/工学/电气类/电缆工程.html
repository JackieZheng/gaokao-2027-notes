<article class="note" data-src="专业/工学/电气类/电缆工程.md"><h1 id="sec-179">电缆工程<button class="gk-tts-title-btn" type="button" data-anchor="sec-179" aria-label="朗读本篇"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M4 9v6h4l5 4V5l-5 4H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16.5 9.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18.7 7.3a7 7 0 0 1 0 9.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></h1>
<p style="text-indent: 2em;"><mark class="ent">电缆工程</mark>是工学门类下电气类中的一个专业，在电网系统的就业链条中具有明确的对口用人需求。</p>
<p style="text-indent: 2em;"><mark class="kw fn">国家电网</mark><sup class="fn-ref" data-term="国家电网"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="9.4" fill="#1F6FB2"/><text x="10" y="14.3" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif">注</text></svg></sup>公司在校园招聘时对<mark class="ent">电缆工程</mark>专业设有专门岗位，属于校招必招专业。这一专业在考生和家长群体中容易存在误解，外界也常低估其就业价值；但从电网系统招聘口径看，<mark class="ent">电缆工程</mark>的用人通道清晰、需求相对稳定，值得作为一条有明确对口就业方向的电气类专业来了解。</p>
<div class="fn-defs"><p><span class="fn-key">国家电网</span> 国家电网有限公司 —— 全球规模最大的公用事业企业，电力行业最主要的就业去向。电气类强校（如电气二龙四虎）毕业生进入国家电网比例高，是衡量电气专业就业含金量的核心指标。</p></div><div class="note-end"><div class="note-end-line"></div><span class="note-end-snow">☃️</span><div class="note-end-line"></div></div></article>
